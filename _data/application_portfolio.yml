intro: "I’m Xuran Zhou, a computer science M.S. student at UC San Diego. My work connects music information retrieval, automatic DJ systems, and electronic music performance."
projects:
  - id: mixweaver
    number: "01"
    title: MixWeaver
    subtitle: Stem-aware automatic DJ transition generation
    category: Research / Music system
    period: Oct. 2025 – Jul. 2026
    location: University of California, San Diego
    distinction: ISMIR 2026 · Accepted
    summary: "How can an automatic DJ make transitions that are both musically coherent and controllable? MixWeaver treats track-to-track mixing as a constrained discrete optimization problem over stem-level gain curves."
    contribution: "I formulated the optimization problem and combined musical analysis, stem-specific transition candidates, and genetic-algorithm search."
    methods: "Beat, tempo, key, and structure analysis; stem-level gain curves; discrete optimization; genetic-algorithm search."
    context: "Research advised by Prof. Julian McAuley. The work was accepted to ISMIR 2026."
    collaborators: "Xuran Zhou, Xunyi Jiang, Churan Zhi, Junda Wu, and Julian McAuley."
    credits_pending: "Confirm the exact division of implementation, experiments, and writing among all collaborators."
    tags: [Music information retrieval, Optimization, Audio]
    image_path: /images/portfolio/mixweaver-paper-fig1.png
